name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax check
        run: |
          python -m compileall .

      - name: Health check (app startup)
        env:
          FLASK_ENV: test
          TESTING: true
          KAFKA_ENABLED: false
        run: |
          python ci_healthcheck.py

      - name: Run tests
        env:
          FLASK_ENV: test
          TESTING: true
          KAFKA_ENABLED: false
        run: |
          if [ -d tests ]; then pytest -v --disable-warnings --tb=short; else echo "No tests found"; fi


