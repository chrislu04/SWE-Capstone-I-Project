<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flagged Anime</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px;">
            <a href="/admin" style="text-decoration:none; color:#007bff;">← Back to Admin Dashboard</a>
            <a href="/home" style="text-decoration:none; color:#333;">Home</a>
        </div>
        <h1>Flagged Anime</h1>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Flagged By</th>
                    <th>Reason</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for flag in flagged_anime %}
                <tr>
                    <td>{{ flag.title }}</td>
                    <td>{{ flag.username }}</td>
                    <td>{{ flag.reason }}</td>
                    <td>{{ flag.createdTime }}</td>
                    <td>
                        <button onclick="updateFlagStatus('{{ flag.flagId }}', 'resolved')">Resolve</button>
                        <button onclick="updateFlagStatus('{{ flag.flagId }}', 'dismissed')">Dismiss</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <script>
        function updateFlagStatus(flagId, status) {
            const url = `/admin/flagged-anime/${flagId}/update`;
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: status })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status})`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    location.reload();
                } else {
                    alert(data.error);
                }
            })
            .catch(err => {
                alert('Failed to update flag: ' + err.message);
            });
        }
    </script>
</body>
</html>
