<!DOCTYPE html>
<html>
<head>
    <title>AniFlow - Watchlists</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333;
        }
        .header { 
            background: white; 
            padding: 15px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            color: #007bff;
            text-decoration: none;
        }
        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }
        .nav-links a:hover {
            color: #007bff;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .section { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .list-group {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .list-group-item {
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: white;
        }
        .list-group-item h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .float-right {
            float: right;
        }
        .mt-3 { margin-top: 15px; }
        .mb-3 { margin-bottom: 15px; }
        .mt-5 { margin-top: 40px; }
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group-append {
            display: flex;
        }
        .d-flex {
            display: flex;
        }
        .justify-content-between {
            justify-content: space-between;
        }
        .align-items-center {
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="/home" class="logo">🎌 AniFlow</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/profile">Profile</a>
                <a href="/watchlists">Watchlist</a>
                <a href="/search">Search</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="section">
            <h2 class="section-title">My Watchlists</h2>
        <div class="mb-3">
            <form id="create-watchlist-form">
                <div class="input-group">
                    <input type="text" class="form-control" id="watchlist-name" placeholder="New watchlist name" required>
                    <div class="input-group-append">
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </div>
            </form>
        </div>
        <ul class="list-group" id="watchlists">
            {% for watchlist in watchlists %}
                <li class="list-group-item" data-watchlist-id="{{ watchlist.watchlistId }}">
                    <h2>{{ watchlist.name }}</h2>
                    <button class="btn btn-danger btn-sm float-right delete-watchlist">Delete Watchlist</button>
                    <ul class="list-group mt-3">
                        {% for item in watchlist.items %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                {{ item.title }}
                                <button class="btn btn-danger btn-sm remove-anime" data-anime-id="{{ item.animeId }}">Remove</button>
                            </li>
                        {% endfor %}
                    </ul>
                    <form class="add-anime-form mt-3">
                        <div class="input-group">
                            <input type="text" class="form-control" name="anime_id" placeholder="Anime ID to add" required>
                            <div class="input-group-append">
                                <button type="submit" class="btn btn-secondary">Add Anime</button>
                            </div>
                        </div>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        document.getElementById('create-watchlist-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('watchlist-name').value;
            const response = await fetch('/watchlists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (response.ok) {
                location.reload();
            } else {
                alert('Failed to create watchlist');
            }
        });

        document.querySelectorAll('.delete-watchlist').forEach(button => {
            button.addEventListener('click', async (e) => {
                const watchlistId = e.target.closest('.list-group-item').dataset.watchlistId;
                const response = await fetch(`/watchlists/${watchlistId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Failed to delete watchlist');
                }
            });
        });

        document.querySelectorAll('.add-anime-form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const watchlistId = e.target.closest('.list-group-item').dataset.watchlistId;
                const animeId = e.target.querySelector('input[name="anime_id"]').value;
                const response = await fetch(`/watchlists/${watchlistId}/animes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: animeId })
                });
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Failed to add anime');
                }
            });
        });

        document.querySelectorAll('.remove-anime').forEach(button => {
            button.addEventListener('click', async (e) => {
                const watchlistId = e.target.closest('.list-group-item').dataset.watchlistId;
                const animeId = e.target.dataset.animeId;
                const response = await fetch(`/watchlists/${watchlistId}/animes/${animeId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Failed to remove anime');
                }
            });
        });
    </script>
        </div>
    </div>
</body>
</html>
