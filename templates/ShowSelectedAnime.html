<!DOCTYPE html>
<html>
<head>
    <title>AniFlow - Anime Details</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333;
        }
        .header { 
            background: white; 
            padding: 15px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            color: #007bff;
            text-decoration: none;
        }
        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }
        .nav-links a:hover {
            color: #007bff;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .section { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .anime-details-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }
        .anime-image {
            width: 100%;
            border-radius: 10px;
        }
        .anime-info h1 {
            margin-top: 0;
        }
        .anime-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .anime-card { 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center;
            background: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .rating {
            color: #ffa500;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="/home" class="logo">🎌 AniFlow</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/profile">Profile</a>
                <a href="/watchlist">Watchlist</a>
                <a href="/search">Advanced Search</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="section">
            <div class="anime-details-grid">
                <div>
                    <img src="https://via.placeholder.com/300x450" alt="{{ anime.title }}" class="anime-image">
                </div>
                <div class="anime-info">
                    <h1>{{ anime.title or "Anime Title" }}</h1>
                    <p>{{ anime.synopsis or "Synopsis not available." }}</p>
                    <div class="anime-meta">
                        <span class="rating">★ {{ anime.averageRating or 'N/A' }}</span>
                        <span>{{ anime.releaseYear or 'N/A' }}</span>
                        <span>{{ anime.episodes or 'N/A' }} episodes</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">If you liked this, you might also like...</h2>
            <div id="recommendations-container" class="anime-row">
                <!-- Recommendations will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const animeId = window.location.pathname.split('/')[2];
            fetch(`/anime/${animeId}/recommendations`)
                .then(response => response.json())
                .then(recommendations => {
                    const container = document.getElementById('recommendations-container');
                    if (recommendations && recommendations.length > 0) {
                        recommendations.forEach(anime => {
                            const animeCard = document.createElement('div');
                            animeCard.classList.add('anime-card');
                            animeCard.innerHTML = `
                                <div class="anime-title">${anime.title}</div>
                                <div class="anime-meta">
                                    <span class="rating">★ ${anime.averageRating || 'N/A'}</span>
                                    <span>${anime.releaseYear || 'N/A'}</span>
                                </div>
                            `;
                            container.appendChild(animeCard);
                        });
                    } else {
                        container.innerHTML = '<p>No recommendations found.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching recommendations:', error);
                    const container = document.getElementById('recommendations-container');
                    container.innerHTML = '<p>Could not load recommendations.</p>';
                });
        });
    </script>
</body>
</html>
