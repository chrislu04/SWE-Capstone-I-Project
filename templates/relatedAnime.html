<!DOCTYPE html>
<html>
<head>
    <title>AniFlow - Similar Anime</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333;
        }
        .header { 
            background: white; 
            padding: 15px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            color: #007bff;
            text-decoration: none;
        }
        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }
        .nav-links a:hover {
            color: #007bff;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .section { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .anime-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 10px;
        }
        .anime-card { 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center;
            background: white;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .anime-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #f0f0f0;
        }
        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #e3f2fd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #1976d2;
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
            height: 2.4em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .anime-synopsis {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            margin-bottom: 10px;
            height: 2.8em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .rating {
            color: #ffa500;
            font-weight: bold;
        }
        .genre-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin: 2px;
            color: #495057;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #6c757d;
            margin-top: 20px;
            width: auto;
            padding: 10px 20px;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .back-button {
            margin-bottom: 20px;
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background-color: white;
            margin: 3% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }
        .modal-close:hover,
        .modal-close:focus {
            color: #000;
        }
        .modal-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        #modalImageContainer {
            width: 220px;
            min-width: 220px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-image {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
        }
        .modal-image-placeholder {
            width: 100%;
            height: 310px;
            background: #e3f2fd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1976d2;
            font-size: 12px;
        }
        .modal-info { flex: 1; }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .modal-detail { margin-bottom: 15px; }
        .modal-detail-label { font-weight: bold; color: #555; margin-bottom: 5px; }
        .modal-genres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .modal-genres .genre-tag { font-size: 12px; padding: 4px 10px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; }
        .modal-watchlist { margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .modal-watchlist label { font-weight: bold; }
        .form-control { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="/home" class="logo">🎌 AniFlow</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/profile">Profile</a>
                <a href="/watchlists">Watchlist</a>
                <a href="/search">Search</a>
            </div>
        </div>
    </div>
    <div class="container">
        <!-- Back Button -->
        <div class="back-button">
            <button class="btn btn-secondary" onclick="window.history.back()">← Back</button>
        </div>

        <!-- Main Section -->
        <div class="section">
            <h2 class="section-title" id="pageTitle">Loading similar anime...</h2>
            <div class="anime-row" id="animeRow">
                <!-- Anime will be populated here -->
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>No similar anime found for this title.</p>
            </div>
            <div id="loadingState" class="loading">
                <div style="font-size: 24px; margin-bottom: 10px;">⏳ Loading recommendations...</div>
            </div>
        </div>
    </div>

    <!-- Anime Detail Modal -->
    <div id="animeModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeAnimeModal()">&times;</span>
            <div class="modal-header">
                <div id="modalImageContainer"></div>
                <div class="modal-info">
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-meta">
                        <div><strong>Rating:</strong> <span id="modalRating">N/A</span></div>
                        <div><strong>Year:</strong> <span id="modalYear">N/A</span></div>
                    </div>
                    <div class="modal-detail">
                        <div class="modal-detail-label">Type:</div>
                        <div id="modalType">N/A</div>
                    </div>
                    <div class="modal-detail">
                        <div class="modal-detail-label">Episodes:</div>
                        <div id="modalEpisodes">N/A</div>
                    </div>
                </div>
            </div>
            <div class="modal-detail" id="genresContainer" style="display: none;">
                <div class="modal-detail-label">Genres:</div>
                <div class="modal-genres" id="modalGenres"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="openRatingPrompt()">Rate This Anime</button>
                <button class="btn" style="background: #28a745;" onclick="goToSimilarFromRelated()">More Like This</button>
                <button class="btn" style="background: #dc3545;" onclick="openFlagModal()">Flag Incorrect Data</button>
            </div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Add to Watchlist:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="watchlistSelect" class="form-control" style="flex: 1;">
                        <option value="">Select watchlist...</option>
                    </select>
                    <button class="btn" onclick="addToWatchlist()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Flag Modal -->
    <div id="flag-modal" class="modal" style="display:none;" onclick="if(event.target === this) closeFlagModal();">
        <div class="modal-content">
            <span class="modal-close" onclick="closeFlagModal()">&times;</span>
            <div style="flex-direction: column; gap: 0;">
                <div class="modal-title" style="margin-bottom: 10px;">Flag Incorrect Data</div>
            </div>
            <textarea id="flag-reason" placeholder="Please provide a reason for flagging this anime..." style="width:100%; height:100px; padding:10px; margin-top:10px; border-radius:5px; border:1px solid #ccc;"></textarea>
            <button class="btn" style="margin-top:10px; padding:10px 20px; border:none; border-radius:5px; background:#007bff; color:white; cursor:pointer;" onclick="submitFlag()">Submit</button>
        </div>
    </div>

    <script>
        let selectedAnimeId = null;
        let watchlists = [];
        let sourceAnimeId = null;

        async function loadWatchlists() {
            try {
                const response = await fetch('/api/watchlists');
                if (response.ok) {
                    watchlists = await response.json();
                    const select = document.getElementById('watchlistSelect');
                    select.innerHTML = '<option value="">Select watchlist...</option>';
                    watchlists.forEach(wl => {
                        const option = document.createElement('option');
                        option.value = wl.watchlistId;
                        option.textContent = wl.name;
                        select.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('Failed to load watchlists:', e);
            }
        }

        async function loadRecommendations() {
            const urlParams = new URLSearchParams(window.location.search);
            sourceAnimeId = urlParams.get('id');
            
            console.log('[DEBUG] loadRecommendations called');
            console.log('[DEBUG] URL:', window.location.href);
            console.log('[DEBUG] sourceAnimeId from query param:', sourceAnimeId);
            
            if (!sourceAnimeId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('pageTitle').textContent = 'No anime ID provided';
                return;
            }

            try {
                const apiUrl = `/api/anime/${sourceAnimeId}/recommendations`;
                console.log('[DEBUG] Fetching from:', apiUrl);
                const response = await fetch(apiUrl, {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('[DEBUG] Recommendations data:', data);
                
                let recommendations = data.recommendations || data || [];
                
                // Ensure recommendations is an array
                if (!Array.isArray(recommendations)) {
                    console.error('Recommendations is not an array:', recommendations);
                    recommendations = [];
                }

                document.getElementById('loadingState').style.display = 'none';

                if (!recommendations || recommendations.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    document.getElementById('pageTitle').textContent = 'No Similar Anime Found';
                    return;
                }

                document.getElementById('pageTitle').textContent = `${recommendations.length} Similar Anime Found`;
                displayAnime(recommendations);
            } catch (error) {
                console.error('Error loading recommendations:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('pageTitle').textContent = `Error: ${error.message}`;
            }
        }

        function displayAnime(animeList) {
            const animeRow = document.getElementById('animeRow');
            animeRow.innerHTML = '';

            console.log('[DEBUG] displayAnime called with animeList:');
            console.log('[DEBUG] List length:', animeList.length);
            if (animeList.length > 0) {
                console.log('[DEBUG] First anime object keys:', Object.keys(animeList[0]));
                console.log('[DEBUG] First anime:', animeList[0]);
            }

            if (!animeList || animeList.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            animeList.forEach(anime => {
                console.log('Processing anime:', anime);
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => showAnimeModal(anime);

                const imageUrl = anime.imageurl || anime.imageUrl;
                const imageHtml = imageUrl 
                    ? `<img src="${imageUrl}" alt="${anime.title}" class="anime-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                       <div class="image-placeholder" style="display: none;">🎬 ${anime.title}</div>`
                    : `<div class="image-placeholder">🎬 ${anime.title}</div>`;

                const genresHtml = anime.genres 
                    ? (typeof anime.genres === 'string' ? anime.genres.split(',') : anime.genres)
                        .slice(0, 5)
                        .map(g => `<span class="genre-tag">${g.trim()}</span>`).join('')
                    : '';

                const rating = anime.averagerating || anime.averageRating || 'N/A';

                card.innerHTML = `
                    ${imageHtml}
                    <div class="anime-title">${anime.title || 'Anime Title'}</div>
                    <div class="anime-synopsis">${anime.synopsis || ''}</div>
                    ${genresHtml}
                    <div class="anime-meta">
                        <span class="rating">★ ${typeof rating === 'number' ? rating.toFixed(1) : rating}</span>
                        <span>${anime.releaseyear || anime.releaseYear || 'N/A'}</span>
                    </div>
                `;
                animeRow.appendChild(card);
            });
        }

        function showAnimeModal(anime) {
            console.log('[DEBUG] showAnimeModal called with anime:', anime);
            // Try multiple field name variations for animeId
            selectedAnimeId = anime.animeid || anime.animeId || anime.id;
            console.log('[DEBUG] Set selectedAnimeId to:', selectedAnimeId);
            
            if (!selectedAnimeId) {
                console.error('[ERROR] Could not find anime ID in object. Available keys:', Object.keys(anime));
            }
            
            // Set image
            const imageUrl = anime.imageurl || anime.imageUrl;
            const imageContainer = document.getElementById('modalImageContainer');
            if (imageUrl) {
                imageContainer.innerHTML = `<img src="${imageUrl}" alt="${anime.title}" class="modal-image" onerror="this.style.display='none'; document.querySelector('.modal-image-placeholder').style.display='flex';">
                                          <div class="modal-image-placeholder" style="display: none;">🎬 ${anime.title}</div>`;
            } else {
                imageContainer.innerHTML = `<div class="modal-image-placeholder">🎬 ${anime.title}</div>`;
            }
            
            // Set basic info
            document.getElementById('modalTitle').textContent = anime.title || 'Anime Title';
            document.getElementById('modalRating').textContent = `★ ${(anime.averagerating || anime.averageRating || 8.0).toFixed(1)}`;
            document.getElementById('modalYear').textContent = anime.releaseyear || anime.releaseYear || 'N/A';
            document.getElementById('modalType').textContent = anime.type || 'N/A';
            document.getElementById('modalEpisodes').textContent = anime.episodes || 'N/A';
            
            // Set genres
            let genreHtml = '';
            if (anime.genres) {
                const genreList = typeof anime.genres === 'string' ? anime.genres.split(',') : anime.genres;
                genreList.forEach(genre => {
                    genreHtml += `<span class="genre-tag">${genre.trim()}</span>`;
                });
            }
            
            const genresContainer = document.getElementById('genresContainer');
            const modalGenres = document.getElementById('modalGenres');
            if (genreHtml) {
                modalGenres.innerHTML = genreHtml;
                genresContainer.style.display = 'block';
            } else {
                genresContainer.style.display = 'none';
            }
            
            // Show modal
            document.getElementById('animeModal').style.display = 'block';
        }

        function closeAnimeModal() {
            document.getElementById('animeModal').style.display = 'none';
            selectedAnimeId = null;
        }

        function openRatingPrompt() {
            if (!selectedAnimeId) return;
            const score = prompt('Rate this anime (1-10):');
            if (score && score >= 1 && score <= 10) {
                fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: selectedAnimeId, score: parseInt(score) })
                }).then(response => {
                    if (response.ok) {
                        alert('Rating submitted! 🎉');
                        closeAnimeModal();
                    } else {
                        alert('Failed to submit rating');
                    }
                });
            }
        }

        function goToSimilarFromRelated() {
            console.log('[DEBUG] goToSimilarFromRelated called');
            console.log('[DEBUG] selectedAnimeId:', selectedAnimeId);
            if (!selectedAnimeId) {
                console.error('[DEBUG] No selectedAnimeId set!');
                return;
            }
            const targetUrl = `/anime/${selectedAnimeId}/recommendations?id=${selectedAnimeId}`;
            console.log('[DEBUG] Navigating to:', targetUrl);
            window.location.href = targetUrl;
        }

        async function addToWatchlist() {
            const selectEl = document.getElementById('watchlistSelect');
            const watchlistId = selectEl.value;
            if (!watchlistId) {
                alert('Please select a watchlist');
                return;
            }
            if (!selectedAnimeId) {
                alert('No anime selected');
                return;
            }
            try {
                const response = await fetch(`/watchlists/${watchlistId}/animes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: selectedAnimeId })
                });
                if (response.ok) {
                    alert('Anime added to watchlist!');
                    closeAnimeModal();
                } else {
                    alert('Failed to add anime to watchlist');
                }
            } catch (e) {
                alert('Error adding to watchlist');
            }
        }

        function openFlagModal() {
            closeAnimeModal();
            document.getElementById('flag-modal').style.display = 'block';
        }

        function closeFlagModal() {
            document.getElementById('flag-modal').style.display = 'none';
        }

        function submitFlag() {
            const reason = document.getElementById('flag-reason').value;
            if (!reason) {
                alert('Please provide a reason.');
                return;
            }

            fetch(`/api/anime/${selectedAnimeId}/flag`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reason: reason })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Successfully flagged for review.');
                    closeFlagModal();
                } else {
                    alert('Failed to flag: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error flagging:', error);
                alert('An error occurred while flagging.');
            });
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('animeModal');
            const flagModal = document.getElementById('flag-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
            if (event.target === flagModal) {
                flagModal.style.display = 'none';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadWatchlists();
            loadRecommendations();
        });
    </script>
</body>
</html>
