<!DOCTYPE html>
<html>
<head>
    <title>AniFlow - Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .header { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .welcome { background: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .anime-card { border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>AniFlow 🎌</h1>
            <a href="/logout">Logout</a>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome">
            <h2>Welcome to Your Anime Dashboard!</h2>
            <p>Your personalized recommendations are ready.</p>
        </div>
        
        <div class="section">
            <h3>Recommended For You</h3>
            <div class="anime-grid">
                {% for anime in feed.sample_anime %}
                <div class="anime-card">
                    <h4>{{ anime.title }}</h4>
                    <p>{{ anime.synopsis[:100] }}...</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
