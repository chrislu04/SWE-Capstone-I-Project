<!DOCTYPE html>
<html>
<head>
    <title>AniFlow - Browse Anime</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333;
        }
        .header { 
            background: white; 
            padding: 15px 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { 
            font-size: 24px; 
            font-weight: bold; 
            color: #007bff;
            text-decoration: none;
        }
        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }
        .nav-links a:hover {
            color: #007bff;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .section { 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
        }
        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .section-card {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 150px;
        }
        .section-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .section-card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .section-card-count {
            font-size: 16px;
            opacity: 0.9;
        }
        .anime-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 10px;
        }
        .anime-card { 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center;
            background: white;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .anime-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #f0f0f0;
        }
        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #e3f2fd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #1976d2;
        }
        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
            height: 2.4em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .anime-synopsis {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            margin-bottom: 10px;
            height: 2.8em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .rating {
            color: #ffa500;
            font-weight: bold;
        }
        .genre-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin: 2px;
            color: #495057;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #6c757d;
            margin-top: 20px;
            width: auto;
            padding: 10px 20px;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        #animeContainer {
            display: none;
        }
        .back-button {
            margin-bottom: 20px;
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background-color: white;
            margin: 3% auto;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }
        .modal-close:hover,
        .modal-close:focus {
            color: #000;
        }
        .modal-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        #modalImageContainer {
            width: 220px;
            min-width: 220px;
            background: #f5f5f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-image {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
        }
        .modal-image-placeholder {
            width: 100%;
            height: 310px;
            background: #e3f2fd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1976d2;
            font-size: 12px;
        }
        .modal-info {
            flex: 1;
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .modal-detail {
            margin-bottom: 15px;
        }
        .modal-detail-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .modal-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .modal-genres .genre-tag {
            font-size: 12px;
            padding: 4px 10px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="/home" class="logo">AniFlow</a>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/profile">Profile</a>
                <a href="/watchlists">Watchlist</a>
                <a href="/search">Search</a>
            </div>
        </div>
    </div>
    <div class="container">
        <!-- Sections Grid -->
        <div id="sectionsView" class="section">
            <h2 class="section-title">Browse Anime Categories</h2>
            <div id="loadingIndicator" style="text-align: center; padding: 40px; display: none;">
                <div style="font-size: 24px; margin-bottom: 10px;">⏳ Loading categories...</div>
                <div style="color: #999; font-size: 14px;">This may take a moment on first load</div>
            </div>
            <div class="sections-grid" id="sectionsGrid">
                <!-- Section cards will be populated here -->
            </div>
        </div>

        <!-- Anime Display -->
        <div id="animeContainer" class="section">
            <div class="back-button">
                <button class="btn btn-secondary" onclick="backToSections()">← Back to Categories</button>
            </div>
            <h2 class="section-title" id="animeTitle"></h2>
            <div class="anime-row" id="animeRow">
                <!-- Anime will be populated here -->
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-secondary" id="loadMoreBtn" onclick="loadMoreAnime()" style="display: none;">Load More Anime</button>
            </div>
        </div>
    </div>

    <!-- Anime Detail Modal -->
    <div id="animeModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeAnimeModal()">&times;</span>
            <div class="modal-header">
                <div id="modalImageContainer"></div>
                <div class="modal-info">
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-meta">
                        <div><strong>Rating:</strong> <span id="modalRating">N/A</span></div>
                        <div><strong>Year:</strong> <span id="modalYear">N/A</span></div>
                    </div>
                    <div class="modal-detail">
                        <div class="modal-detail-label">Type:</div>
                        <div id="modalType">N/A</div>
                    </div>
                    <div class="modal-detail">
                        <div class="modal-detail-label">Episodes:</div>
                        <div id="modalEpisodes">N/A</div>
                    </div>
                </div>
            </div>
            <div class="modal-detail" id="genresContainer" style="display: none;">
                <div class="modal-detail-label">Genres:</div>
                <div class="modal-genres" id="modalGenres"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="openRatingPrompt()">Rate This Anime</button>
                <button class="btn" style="background: #28a745;" onclick="goToSimilarFromBrowse()">More Like This</button>
                <button class="btn" style="background: #dc3545;" onclick="openFlagModalFromBrowse()">Flag Incorrect Data</button>
            </div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">Add to Watchlist:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="browseWatchlistSelect" class="form-control" style="flex: 1;">
                        <option value="">Select watchlist...</option>
                    </select>
                    <button class="btn" onclick="addBrowseToWatchlist()">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Flag Modal (reusing structure from ShowSelectedAnime.html) -->
    <div id="flag-modal" class="modal" style="display:none;" onclick="if(event.target === this) closeFlagModal();">
        <div class="modal-content">
            <span class="modal-close" onclick="closeFlagModal()">&times;</span>
            <div class="modal-header" style="flex-direction: column; gap: 0;">
                <div class="modal-title" style="margin-bottom: 10px;">Flag Incorrect Data</div>
            </div>
            <textarea id="flag-reason" placeholder="Please provide a reason for flagging this anime..." style="width:100%; height:100px; padding:10px; margin-top:10px; border-radius:5px; border:1px solid #ccc;"></textarea>
            <button class="btn" style="margin-top:10px; padding:10px 20px; border:none; border-radius:5px; background:#007bff; color:white; cursor:pointer;" onclick="submitFlag()">Submit</button>
        </div>
    </div>

    <script>
        let sections = [];
        let currentSection = null;
        let currentOffset = 0;
        const ANIME_PER_PAGE = 60;
        let selectedAnimeForRating = null;
        let browseWatchlists = [];

        async function loadBrowseWatchlists() {
            try {
                const response = await fetch('/api/watchlists');
                if (response.ok) {
                    browseWatchlists = await response.json();
                    const select = document.getElementById('browseWatchlistSelect');
                    select.innerHTML = '<option value="">Select watchlist...</option>';
                    browseWatchlists.forEach(wl => {
                        const option = document.createElement('option');
                        option.value = wl.watchlistId;
                        option.textContent = wl.name;
                        select.appendChild(option);
                    });
                }
            } catch (e) {
                console.error('Failed to load watchlists:', e);
            }
        }

        async function addBrowseToWatchlist() {
            const selectEl = document.getElementById('browseWatchlistSelect');
            const watchlistId = selectEl.value;
            if (!watchlistId) {
                alert('Please select a watchlist');
                return;
            }
            if (!selectedAnimeForRating) {
                alert('No anime selected');
                return;
            }
            try {
                const response = await fetch(`/watchlists/${watchlistId}/animes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: selectedAnimeForRating })
                });
                if (response.ok) {
                    alert('Anime added to watchlist!');
                } else {
                    alert('Failed to add anime to watchlist');
                }
            } catch (e) {
                alert('Error adding to watchlist');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSections();
            loadBrowseWatchlists();
        });

        function loadSections() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('sectionsGrid').innerHTML = '';
            
            fetch('/api/browse/sections')
                .then(response => response.json())
                .then(data => {
                    console.log('Sections loaded:', data);
                    document.getElementById('loadingIndicator').style.display = 'none';
                    sections = data.sections || [];
                    displaySections();
                })
                .catch(error => {
                    console.error('Error loading sections:', error);
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('sectionsGrid').innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Error loading sections. Please try again later.</div>';
                });
        }

        function displaySections() {
            const grid = document.getElementById('sectionsGrid');
            grid.innerHTML = '';
            
            console.log('Sections array:', sections);
            console.log('Sections length:', sections ? sections.length : 'null');
            
            if (!sections || sections.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No anime categories available yet. Please import anime data first from the Admin panel.</div>';
                return;
            }
            
            sections.forEach(section => {
                console.log('Creating section card for:', section);
                const card = document.createElement('div');
                card.className = 'section-card';
                card.innerHTML = `
                    <div class="section-card-title">${section.name}</div>
                    <div class="section-card-count">${section.count} anime</div>
                `;
                card.onclick = () => selectSection(section);
                grid.appendChild(card);
            });
        }

        function selectSection(section) {
            currentSection = section;
            currentOffset = 0;
            
            document.getElementById('sectionsView').style.display = 'none';
            document.getElementById('animeContainer').style.display = 'block';
            document.getElementById('animeTitle').textContent = section.name;
            
            loadAnimeForSection();
        }

        function loadAnimeForSection() {
            const animeRow = document.getElementById('animeRow');
            
            if (currentOffset === 0) {
                animeRow.innerHTML = '<div class="loading">Loading anime...</div>';
            }
            
            fetch(`/api/browse/anime/${currentSection.id}?offset=${currentOffset}&limit=${ANIME_PER_PAGE}`)
                .then(response => response.json())
                .then(data => {
                    if (currentOffset === 0) {
                        animeRow.innerHTML = '';
                    }
                    
                    if (data.anime.length === 0 && currentOffset === 0) {
                        animeRow.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No anime available in this section</div>';
                    } else {
                        data.anime.forEach(anime => {
                            const card = document.createElement('div');
                            card.className = 'anime-card';
                            card.style.cursor = 'pointer';
                            card.onclick = () => showAnimeModal(anime);
                            
                            const imageUrl = anime.imageurl || anime.imageUrl || null;
                            const imageHtml = imageUrl 
                                ? `<img src="${imageUrl}" alt="${anime.title}" class="anime-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                   <div class="image-placeholder" style="display: none;">${(anime.title || 'Anime').substring(0, 20)}</div>`
                                : `<div class="image-placeholder">${(anime.title || 'Anime').substring(0, 20)}</div>`;
                            
                            let genreHtml = '';
                            if (anime.genres) {
                                const genreList = typeof anime.genres === 'string' ? anime.genres.split(',') : anime.genres;
                                genreList.slice(0, 5).forEach(genre => {
                                    genreHtml += `<span class="genre-tag">${genre.trim()}</span>`;
                                });
                            }
                            
                            card.innerHTML = `
                                ${imageHtml}
                                <div class="anime-title">${anime.title || 'Anime Title'}</div>
                                <div class="anime-meta">
                                    <span class="rating">★ ${(anime.averagerating || anime.averageRating || 8.0).toFixed(1)}</span>
                                    <span>${anime.releaseyear || anime.releaseYear || '2023'}</span>
                                </div>
                                <div style="margin-top: 10px;">
                                    ${genreHtml}
                                </div>
                            `;
                            animeRow.appendChild(card);
                        });
                    }
                    
                    // Update load more button
                    const loadMoreBtn = document.getElementById('loadMoreBtn');
                    if (data.anime.length === ANIME_PER_PAGE) {
                        loadMoreBtn.style.display = 'inline-block';
                    } else {
                        loadMoreBtn.style.display = 'none';
                    }
                    
                    currentOffset += ANIME_PER_PAGE;
                })
                .catch(error => {
                    console.error('Error loading anime:', error);
                    document.getElementById('animeRow').innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Error loading anime. Please try again.</div>';
                });
        }

        function loadMoreAnime() {
            loadAnimeForSection();
        }

        function backToSections() {
            currentSection = null;
            currentOffset = 0;
            
            document.getElementById('sectionsView').style.display = 'block';
            document.getElementById('animeContainer').style.display = 'none';
            document.getElementById('animeRow').innerHTML = '';
        }

        function rateAnime(event, animeId) {
            event.stopPropagation();
            const score = prompt('Rate this anime (1-10):');
            if (score && score >= 1 && score <= 10) {
                fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: animeId, score: parseInt(score) })
                }).then(response => {
                    if (response.ok) {
                        alert('Rating submitted!');
                        // Stay on current view; optionally update local UI
                        // e.g., add a subtle checkmark or update recent ratings asynchronously
                    } else {
                        alert('Failed to submit rating');
                    }
                });
            }
        }

        function showAnimeModal(anime) {
            selectedAnimeForRating = anime.animeid || anime.animeId;
            
            // Set image
            const imageUrl = anime.imageurl || anime.imageUrl;
            const imageContainer = document.getElementById('modalImageContainer');
            if (imageUrl) {
                imageContainer.innerHTML = `<img src="${imageUrl}" alt="${anime.title}" class="modal-image" onerror="this.style.display='none'; document.querySelector('.modal-image-placeholder').style.display='flex';">
                                          <div class="modal-image-placeholder" style="display: none;">${anime.title}</div>`;
            } else {
                imageContainer.innerHTML = `<div class="modal-image-placeholder">${anime.title}</div>`;
            }
            
            // Set basic info
            document.getElementById('modalTitle').textContent = anime.title || 'Anime Title';
            document.getElementById('modalRating').textContent = `★ ${(anime.averagerating || anime.averageRating || 8.0).toFixed(1)}`;
            document.getElementById('modalYear').textContent = anime.releaseyear || anime.releaseYear || 'N/A';
            document.getElementById('modalType').textContent = anime.type || 'N/A';
            document.getElementById('modalEpisodes').textContent = anime.episodes || 'N/A';
            
            // Set genres
            let genreHtml = '';
            if (anime.genres) {
                const genreList = typeof anime.genres === 'string' ? anime.genres.split(',') : anime.genres;
                genreList.forEach(genre => {
                    genreHtml += `<span class="genre-tag">${genre.trim()}</span>`;
                });
            }
            
            const genresContainer = document.getElementById('genresContainer');
            const modalGenres = document.getElementById('modalGenres');
            if (genreHtml) {
                modalGenres.innerHTML = genreHtml;
                genresContainer.style.display = 'block';
            } else {
                genresContainer.style.display = 'none';
            }
            
            // Show modal
            document.getElementById('animeModal').style.display = 'block';
        }

        function closeAnimeModal() {
            document.getElementById('animeModal').style.display = 'none';
            // Preserve selectedAnimeForRating so flagging can use it
        }

        function openRatingPrompt() {
            if (!selectedAnimeForRating) return;
            const score = prompt('Rate this anime (1-10):');
            if (score && score >= 1 && score <= 10) {
                fetch('/api/ratings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anime_id: selectedAnimeForRating, score: parseInt(score) })
                }).then(response => {
                    if (response.ok) {
                        alert('Rating submitted!');
                        closeAnimeModal();
                        // Do not reload; keep user in the current section
                    } else {
                        alert('Failed to submit rating');
                    }
                });
            }
        }

        function goToSimilarFromBrowse() {
            if (!selectedAnimeForRating) return;
            window.location.href = `/anime/${selectedAnimeForRating}/recommendations?id=${selectedAnimeForRating}`;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const animeModal = document.getElementById('animeModal');
            const flagModal = document.getElementById('flag-modal');
            if (event.target === animeModal) {
                animeModal.style.display = 'none';
            }
            if (event.target === flagModal) {
                flagModal.style.display = 'none';
            }
        }

        function openFlagModalFromBrowse() {
            closeAnimeModal(); // Close the anime detail modal first, keep selectedAnimeForRating
            document.getElementById('flag-modal').style.display = 'block';
        }

        function closeFlagModal() {
            document.getElementById('flag-modal').style.display = 'none';
        }

        function submitFlag() {
            const animeId = selectedAnimeForRating; // Use the anime ID from the browse modal
            const reason = document.getElementById('flag-reason').value;

            if (!reason) {
                alert('Please provide a reason.');
                return;
            }

            if (!animeId) {
                alert('No anime selected to flag. Please open an anime and try again.');
                return;
            }

            fetch(`/api/anime/${animeId}/flag`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    reason: reason,
                }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Successfully flagged for review.');
                    closeFlagModal();
                } else {
                    alert('Failed to flag: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error flagging:', error);
                alert('An error occurred while flagging.');
            });
        }
    </script>
</body>
